services:
  app:
    build: .
    container_name: aws-sound-button
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - ./app:/app
      - ~/.aws:/root/.aws:ro
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  nginx:
    image: nginx:alpine
    container_name: aws-sound-button-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${HOME}/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
